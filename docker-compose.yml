services:
  portfolio-dev:
    build: ./website
    container_name: portfolio-dev
    mem_limit: 2560m
    memswap_limit: 2560m
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=1024
    volumes:
      - ./website:/app                              # Live source sync from host
      - node_modules:/app/node_modules              # Named volume keeps container's built-in node_modules
      - ~/.claude:/root/.claude                     # Reuse host Claude auth, memory, and settings
      - .:/workspaces/vineethk96.github.io:cached  # Workspace mount for VS Code devcontainer
    env_file:
      - ./website/.env.local            # Supabase credentials (not baked into image)
    stdin_open: true
    tty: true

  sanity-studio:
    build: ./sanity_cms
    container_name: sanity-studio
    mem_limit: 1.5g
    memswap_limit: 1.5g
    ports:
      - "3333:3333"
    environment:
      - NODE_OPTIONS=--max-old-space-size=1024
    volumes:
      - ./sanity_cms:/app                           # Live source sync from host
      - sanity_node_modules:/app/node_modules       # Isolated named volume (separate from website)
      - ~/.claude:/root/.claude                     # Reuse host Claude auth, memory, and settings
      - ~/.config/sanity:/root/.config/sanity         # Reuse host Sanity auth token (rw so CLI can refresh token)
    env_file:
      - path: ./sanity_cms/.env.local               # Auth tokens (optional — only if file exists)
        required: false
    stdin_open: true
    tty: true

volumes:
  node_modules:
  sanity_node_modules:
