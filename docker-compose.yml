services:
  portfolio-dev:
    build: ./website
    container_name: portfolio-dev
    ports:
      - "3000:3000"
    volumes:
      - ./website:/app                  # Live source sync from host
      - node_modules:/app/node_modules  # Named volume keeps container's built-in node_modules
      - ~/.claude:/root/.claude         # Reuse host Claude auth, memory, and settings
    env_file:
      - ./website/.env.local            # Supabase credentials (not baked into image)
    stdin_open: true
    tty: true

  sanity-studio:
    build: ./sanity_cms
    container_name: sanity-studio
    ports:
      - "3333:3333"
    volumes:
      - ./sanity_cms:/app                           # Live source sync from host
      - sanity_node_modules:/app/node_modules       # Isolated named volume (separate from website)
      - ~/.claude:/root/.claude                     # Reuse host Claude auth, memory, and settings
    env_file:
      - path: ./sanity_cms/.env.local               # Auth tokens (optional — only if file exists)
        required: false
    stdin_open: true
    tty: true

volumes:
  node_modules:
  sanity_node_modules:
