<style>
        .blueprint-bg {
            background-color: #fbf9f4;
            background-image: 
                linear-gradient(#e4e2dd 1px, transparent 1px),
                linear-gradient(90deg, #e4e2dd 1px, transparent 1px);
            background-size: 80px 80px;
            position: relative;
        }

        .blueprint-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(228, 226, 221, 0.5) 0.5px, transparent 0.5px),
                linear-gradient(90deg, rgba(228, 226, 221, 0.5) 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        .crosshair-mark {
            position: absolute;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }
        
        .crosshair-mark::before, .crosshair-mark::after {
            content: '';
            position: absolute;
            background: #75777e;
            opacity: 0.3;
        }
        
        .crosshair-mark::before {
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            transform: translateX(-50%);
        }
        
        .crosshair-mark::after {
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            transform: translateY(-50%);
        }

        .led-pulse {
            animation: pulse-green 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-green {
            0%, 100% { opacity: 1; }
            50% { opacity: .4; }
        }

        .header-shadow {
            box-shadow: 4px 4px 0px 0px rgba(3, 22, 50, 1);
