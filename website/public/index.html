<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Restore URL from GitHub Pages SPA redirect
      (function () {
        var p = window.location.search.slice(1)
          .split('&')
          .reduce(function (q, kv) {
            var parts = kv.split('=');
            q[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
            return q;
          }, {});
        if (p['p']) {
          var path = decodeURIComponent(p['p']);
          // Only allow safe path characters — reject javascript: and other protocol injections
          if (/^\/[a-zA-Z0-9\-_./#?=&%]*$/.test(path)) {
            var qs = window.location.search
              .replace(/[?&]p=[^&]*/, '')
              .replace(/[?&]h=[^&]*/, '')
              .replace(/^&/, '?');
            var hash = p['h'] ? '#' + p['h'] : '';
            window.history.replaceState(null, null, path + qs + hash);
          }
        }
      })();
    </script>
