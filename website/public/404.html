<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vineeth Kirandumkara - IoT Systems Engineer</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Encodes the current path/query/hash into ?p=/the/path
      // then redirects to the root so index.html is served
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) +
        (l.hash ? '&h=' + encodeURIComponent(l.hash) : '')
      );
    </script>
  </head>
  <body></body>
</html>
